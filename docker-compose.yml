services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenantiq
      POSTGRES_PASSWORD: tenantiq123
      POSTGRES_DB: tenantiq_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantiq -d tenantiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./tenantiq-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tenantiq_db
      DB_USER: tenantiq
      DB_PASSWORD: tenantiq123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
